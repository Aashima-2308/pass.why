<!DOCTYPE html>
<html>

<head>
    <title>Secure Login</title>

    <!-- Connects HTML to CSS -->
    <link rel="stylesheet" href="styleu.css">
</head>

<body>

    <div class="login-box">

        <!-- <p class="badge">PassWorse</p> -->

        <h1>Very Secure Login</h1>

        <p class="subtitle">
            Because one layer of security was apparently not enough.
        </p>

        <h5>USERNAME OR IDENTITY</h5>

        <input type="text" placeholder="Write email">


        <h5>PASSWORD</h5>

        <input id="pwdinput" type="password" placeholder="Enter password">


        <p class="tip">
            Tip: Keep it short
        </p>


        <button id="continueButton">
            Continue to Verification →
        </button>


        <hr>


        <p class="footer">
            🛡 Enterprise-grade security
        </p>

    </div>
<script src="script1.js"></script>
</body>

</html>
