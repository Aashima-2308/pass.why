<!DOCTYPE html>
<html>

<head>
    <title>Secure Login</title>

    <!-- Connects HTML to CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-box">

        <p class="badge">🔒 High Assurance Auth</p>

        <h1>Secure Login</h1>

        <p class="subtitle">
            Because one layer of security was apparently not enough.
        </p>

        <h5>USERNAME OR IDENTITY</h5>

        <input type="text" placeholder="Write email">


        <h5>PASSWORD</h5>

        <input type="password" placeholder="Enter password">


        <p class="tip">
            Tip: Keep it short
        </p>


        <button>
            Continue to Verification →
        </button>


        <hr>


        <p class="footer">
            🛡 Enterprise-grade security
        </p>

    </div>

</body>

</html>
